<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: w3cover: https://media.retroachievements.org https://retroachievements.org; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090d" />
    <title>W3Labs Entertainment System</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./theme.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <svg class="svg-sprite" aria-hidden="true" focusable="false">
      <symbol id="i-library" viewBox="0 0 24 24">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16.5A1.5 1.5 0 0 0 18.5 21H6a2 2 0 0 1-2-2V5.5Z" />
        <path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20M8 7h8M8 10.5h5" />
      </symbol>
      <symbol id="i-bios" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="3" />
        <path d="M9 9h6v6H9zM9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3" />
      </symbol>
      <symbol id="i-controller" viewBox="0 0 24 24">
        <path
          d="M7.5 7h9a4.5 4.5 0 0 1 4.3 5.8l-1.2 4a2.7 2.7 0 0 1-4.6 1l-2-2h-2l-2 2a2.7 2.7 0 0 1-4.6-1l-1.2-4A4.5 4.5 0 0 1 7.5 7Z"
        />
        <path d="M8 11v4M6 13h4M15.5 12.5h.01M18 15h.01" />
      </symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24">
        <path
          d="M8 4h8v5a4 4 0 0 1-8 0V4ZM8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 13v4M8 21h8M9 17h6"
        />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" />
        <path
          d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"
        />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-4-4" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z" /></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></symbol>
      <symbol id="i-star" viewBox="0 0 24 24">
        <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" /></symbol>
      <symbol id="i-hardcore" viewBox="0 0 24 24">
        <path d="M12 3 4.5 6v5.2c0 4.7 3.2 8.2 7.5 9.8 4.3-1.6 7.5-5.1 7.5-9.8V6L12 3Z" />
        <path d="m9 12 2 2 4-4" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </symbol>
      <symbol id="i-folder" viewBox="0 0 24 24">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" />
      </symbol>
      <symbol id="i-save" viewBox="0 0 24 24">
        <path d="M5 3h12l2 2v16H5V3Z" />
        <path d="M8 3v6h8V3M8 21v-7h8v7" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6" />
      </symbol>
      <symbol id="i-edit" viewBox="0 0 24 24">
        <path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z" />
      </symbol>
      <symbol id="i-database" viewBox="0 0 24 24">
        <ellipse cx="12" cy="6" rx="7" ry="3" />
        <path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6" />
      </symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="12" rx="2" />
        <path d="M8 20h8M12 16v4" />
      </symbol>
      <symbol id="i-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 11v5M12 8h.01" />
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
        />
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
      </symbol>
    </svg>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <img
              class="brand-logo"
              src="./assets/W3Labs.png"
              alt="W3Labs"
              width="200"
              height="200"
              decoding="async"
            />
          </div>
          <div class="brand-copy">
            <strong>W3Labs</strong>
            <span>Entertainment System</span>
          </div>
        </div>

        <nav class="main-nav" aria-label="Navegação principal">
          <p class="nav-label">Sistema</p>
          <button class="nav-item is-active" data-nav="library">
            <svg><use href="#i-library"></use></svg>
            <span>Biblioteca</span>
            <span class="nav-count" id="navGameCount">0</span>
          </button>
          <button class="nav-item" data-nav="bios">
            <svg><use href="#i-bios"></use></svg>
            <span>BIOS &amp; Firmware</span>
            <span class="nav-dot" id="navBiosDot" hidden></span>
          </button>
          <button class="nav-item" data-nav="controllers">
            <svg><use href="#i-controller"></use></svg>
            <span>Controles</span>
          </button>
          <button class="nav-item" data-nav="achievements">
            <svg><use href="#i-trophy"></use></svg>
            <span>Conquistas</span>
            <span class="nav-hardcore" id="navHardcore" hidden>HC</span>
          </button>
          <p class="nav-label second">Aplicativo</p>
          <button class="nav-item" data-nav="settings">
            <svg><use href="#i-settings"></use></svg>
            <span>Configurações</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <button class="hardcore-card" id="sidebarHardcore" type="button">
            <span class="hardcore-icon"
              ><svg><use href="#i-hardcore"></use></svg
            ></span>
            <span class="hardcore-copy">
              <strong>Modo Hardcore</strong>
              <small id="hardcoreSideText">Desativado</small>
            </span>
            <span class="switch" id="hardcoreSwitch" aria-hidden="true"><span></span></span>
          </button>
          <div class="runtime-card">
            <svg><use href="#i-database"></use></svg>
            <div>
              <strong>SQLite · WAL</strong>
              <small>Dados locais, sem nuvem</small>
            </div>
          </div>
          <p class="version-line">v1.0.0 · release</p>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="topbar-title">
            <span class="eyebrow" id="topbarEyebrow">Coleção unificada</span>
            <strong id="topbarTitle">Biblioteca</strong>
          </div>
          <label class="global-search" for="globalSearch">
            <svg><use href="#i-search"></use></svg>
            <input
              id="globalSearch"
              type="search"
              placeholder="Buscar jogos, gêneros, publicadoras..."
              autocomplete="off"
            />
            <kbd>Ctrl K</kbd>
          </label>
          <div class="topbar-actions">
            <button class="icon-button" id="refreshButton" type="button" title="Atualizar biblioteca">
              <svg><use href="#i-refresh"></use></svg>
            </button>
            <button
              class="icon-button theme-toggle"
              id="themeToggle"
              type="button"
              title="Ativar tema escuro"
              aria-label="Alternar tema"
              aria-pressed="false"
            >
              <svg class="icon-sun" aria-hidden="true"><use href="#i-sun"></use></svg>
              <svg class="icon-moon" aria-hidden="true"><use href="#i-moon"></use></svg>
            </button>
            <button class="user-chip" id="raTopChip" type="button">
              <span class="user-avatar" id="raAvatar">W3</span>
              <span class="user-copy">
                <strong id="raTopName">RetroAchievements</strong>
                <small id="raTopState">não conectado</small>
              </span>
              <svg><use href="#i-chevron"></use></svg>
            </button>
          </div>
        </header>

        <div class="active-strip" id="activeStrip" hidden></div>
        <section id="view" class="view" aria-live="polite">
          <div class="boot-skeleton">
            <div class="skeleton hero-skeleton"></div>
            <div class="skeleton-grid">
              <div class="skeleton"></div>
              <div class="skeleton"></div>
              <div class="skeleton"></div>
              <div class="skeleton"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="scan-dock" id="scanDock" hidden>
      <div class="scan-head">
        <span class="scan-pulse"></span>
        <strong id="scanTitle">Escaneando biblioteca</strong>
        <span id="scanPercent"></span>
      </div>
      <p id="scanDetail">Preparando arquivos...</p>
      <div class="progress-track"><span id="scanProgress"></span></div>
    </div>

    <div id="toastRoot" class="toast-root" aria-live="assertive"></div>
    <div id="modalRoot"></div>
  </body>
</html>
